<!doctype html>
<html lang="ar" dir="rtl" data-server="lucifer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0B">
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ الألوان (كل سيرفر إله لوحته) */
:root {
  --bg: #0A0A0B; --card: #141416; --raised: #1E1E22; --hover: #25252B; --border: #2C2C33; --control: #6B6B78;
  --text: #F5F5F4; --muted: #A1A1AA; --faint: #8E8E98;
  --accent: #E6D724; --primary: #E6D724; --on-primary: #111108; --wash: rgba(230, 215, 36, .10); --ring: #E6D724;
  --series-1: #c98500; --series-2: #3987e5;
  --good: #22C55E; --warn: #F59E0B; --bad: #F87171;
  --font: "Inter", "Noto Sans Arabic", system-ui, "Segoe UI", Tahoma, sans-serif;
  --bar-h: 56px; --side-w: 248px; --r-card: 14px; --r-ctl: 10px;
  --fast: 150ms; --slow: 240ms; --ease-out: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 var(--font); min-height: 100dvh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 16px; height: 16px; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .4s; }
@keyframes sk { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { *, ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; transition: none !important; } }

/* ------------------------------------------------------------------ أساسيات */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); min-width: 0; }
.card-pad { padding: 16px; }
.card-head { display: flex; align-items: center; gap: 12px; padding: 16px 16px 0; }
.card-head h2 { font-size: 16px; font-weight: 600; line-height: 1.4; flex: 1; }
.card-note { color: var(--muted); font-size: 14px; padding: 4px 16px 0; }
.stack { display: grid; gap: 16px; }
.cols { display: grid; gap: 16px; } .cols > *, .stack > * { min-width: 0; }
@media (min-width: 900px) { .cols { grid-template-columns: 1fr 1fr; align-items: start; } }
.sk { display: block; border-radius: 8px; background: linear-gradient(90deg, var(--raised) 25%, var(--hover) 37%, var(--raised) 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; }

label.f { display: grid; gap: 8px; }
.f-label { font-weight: 600; font-size: 14px; }
.f-help { color: var(--muted); font-size: 14px; line-height: 1.5; }
.input, textarea.input { width: 100%; background: var(--raised); border: 1px solid var(--control); border-radius: var(--r-ctl); padding: 10px 12px; min-height: 44px; transition: border-color var(--fast); }
textarea.input { resize: vertical; line-height: 1.7; display: block; field-sizing: content; max-height: 70vh; }
.input::placeholder { color: var(--faint); }
.input:focus { outline: 2px solid var(--ring); outline-offset: 1px; }
.field-icon { position: relative; }
.field-icon .ic { position: absolute; inset-inline-start: 12px; top: 12px; color: var(--faint); pointer-events: none; }
.field-icon .input { padding-inline-start: 40px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-ctl); font-weight: 600; font-size: 14px; border: 1px solid var(--border); background: var(--raised); white-space: nowrap; transition: background var(--fast), border-color var(--fast), transform var(--fast), opacity var(--fast); }
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; }
.btn.ghost:hover { background: var(--raised); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.icon-btn { width: 44px; height: 44px; border-radius: var(--r-ctl); border: 1px solid var(--border); display: grid; place-items: center; color: var(--muted); flex: none; transition: background var(--fast), color var(--fast), transform var(--fast); }
.icon-btn:hover { color: var(--text); background: var(--raised); }
.icon-btn:active { transform: scale(.94); }
.icon-btn[disabled] { opacity: .35; cursor: not-allowed; }
.icon-btn.bare { border-color: transparent; }
.text-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; margin: -10px -8px; border-radius: 8px; color: var(--accent); font-weight: 600; font-size: 14px; }
.text-btn:hover { background: var(--wash); }
.switch { position: relative; width: 52px; height: 32px; border-radius: 32px; background: var(--raised); border: 1px solid var(--control); flex: none; transition: background var(--fast), border-color var(--fast); }
.switch::before { content: ""; position: absolute; inset: -7px 0; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: inset-inline-start var(--fast) var(--ease-out), background var(--fast); }
.switch[aria-checked="true"] { background: var(--primary); border-color: transparent; }
.switch[aria-checked="true"]::after { inset-inline-start: 23px; background: var(--on-primary); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 16px; margin-inline: -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 14px; font-weight: 500; flex: none; transition: background var(--fast), border-color var(--fast), color var(--fast); }
.chip:hover { background: var(--raised); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: var(--wash); font-weight: 600; }
.chip i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip .num { color: var(--faint); font-size: 13px; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--good); } .dot.off { background: var(--bad); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty .ic { width: 32px; height: 32px; color: var(--faint); stroke-width: 1.5; }
.empty h2 { font-size: 18px; font-weight: 600; color: var(--text); }
.empty p { max-width: 44ch; font-size: 15px; }
.notice { display: grid; grid-template-columns: 20px 1fr; gap: 12px; border: 1px solid var(--border); border-inline-start: 3px solid var(--warn); border-radius: var(--r-ctl); padding: 12px 14px; font-size: 14px; background: var(--card); }
.notice .ic { color: var(--warn); margin-top: 2px; }
.notice.bad { border-inline-start-color: var(--bad); } .notice.bad .ic { color: var(--bad); }
.notice b { display: block; font-weight: 600; }
.notice ul { margin: 4px 0 0; padding-inline-start: 18px; }

/* ------------------------------------------------------------------ الدخول */
.login { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.login-card { width: min(400px, 100%); padding: 28px 24px; display: grid; gap: 20px; }
.login h1 { font-size: 24px; font-weight: 700; line-height: 1.3; }
.login .pair { display: flex; gap: 8px; margin-top: 8px; }
.login .pair span { font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 20px; border: 1px solid var(--border); }
.login .pair span:first-child { color: #E6D724; }
.login form { display: grid; gap: 16px; }
.login .err { color: var(--bad); font-size: 14px; display: flex; gap: 8px; align-items: center; }
.pass { position: relative; } .pass .input { padding-left: 48px; }
.pass .icon-btn { position: absolute; inset-inline-end: 0; top: 0; border: 0; }

/* ------------------------------------------------------------------ الهيكل */
.topbar { position: sticky; top: 0; z-index: 20; min-height: var(--bar-h); display: flex; align-items: center; gap: 8px; padding: 4px 8px; padding-top: calc(4px + env(safe-area-inset-top)); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.topbar h1 { font-size: 18px; font-weight: 600; line-height: 1.3; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.server-switch { display: flex; padding: 2px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); flex: none; }
.server-switch button { font-weight: 600; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: 10px; color: var(--muted); transition: background var(--fast), color var(--fast); }
.server-switch button:hover { color: var(--text); }
.server-switch button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .62); z-index: 40; opacity: 0; pointer-events: none; transition: opacity var(--slow); }
.side { position: fixed; inset-block: 0; inset-inline-start: 0; width: min(var(--side-w), 84vw); background: var(--card); border-inline-end: 1px solid var(--border); z-index: 50; transform: translateX(100%); visibility: hidden; transition: transform var(--slow) var(--ease-out), visibility 0s var(--slow); display: flex; flex-direction: column; padding: 16px 12px; padding-top: calc(16px + env(safe-area-inset-top)); padding-bottom: calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; }
body.side-open .side { transform: none; visibility: visible; transition: transform var(--slow) var(--ease-out); }
body.side-open .scrim { opacity: 1; pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 16px; }
.brand .mark { width: 40px; height: 40px; border-radius: 12px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
.brand .name { font-weight: 700; font-size: 18px; line-height: 1.2; }
.brand .sub { color: var(--muted); font-size: 13px; }
.nav-group { color: var(--faint); font-size: 12px; font-weight: 600; padding: 16px 12px 4px; }
.nav a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; margin-bottom: 2px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 15px; border-radius: var(--r-ctl); transition: background var(--fast), color var(--fast); }
.nav a:hover { background: var(--raised); color: var(--text); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--wash); font-weight: 600; }
.side .foot { margin-top: auto; padding-top: 16px; display: grid; gap: 4px; }
.bot-state { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; padding: 6px 12px; }
.bot-state b { color: var(--text); font-weight: 500; }
main { padding: 16px 16px 120px; max-width: 920px; margin-inline: auto; display: grid; gap: 16px; outline: none; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1024px) {
  .menu-btn, .scrim { display: none !important; }
  .side { transform: none; visibility: visible; }
  .topbar, main, .savebar { margin-inline-start: var(--side-w); }
  main { padding: 24px 32px 120px; max-width: none; } main > * { max-width: 960px; width: 100%; }
  .topbar { padding-inline: 32px; }
}

/* ------------------------------------------------------------------ بطاقات الأرقام */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 700px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kpis.three .kpi.lead { grid-column: span 2; }
@media (min-width: 700px) { .kpis.three .kpi.lead { grid-column: auto; } }
.kpi { position: relative; padding: 14px 16px; padding-inline-start: 22px; display: grid; gap: 4px; align-content: start; }
.kpi::before { content: ""; position: absolute; inset-block: 14px; inset-inline-start: 10px; width: 3px; border-radius: 3px; background: var(--border); }
.kpi .l { color: var(--muted); font-size: 14px; line-height: 1.4; }
.kpi .v { font-size: 28px; font-weight: 700; line-height: 1.2; unicode-bidi: isolate; }
.kpi .s { color: var(--faint); font-size: 13px; }
.kpi.lead::before { background: var(--accent); } .kpi.lead .v { font-size: 36px; color: var(--accent); }
.kpi.good::before { background: var(--good); } .kpi.warn::before { background: var(--warn); } .kpi.bad::before { background: var(--bad); }

/* ------------------------------------------------------------------ الزبائن */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .sp { flex: 1; }
.toolbar .note { color: var(--muted); font-size: 13px; }
.rows { overflow: hidden; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background var(--fast); }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--raised); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--raised); object-fit: cover; display: grid; place-items: center; font-weight: 600; color: var(--muted); overflow: hidden; }
.row .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { color: var(--muted); font-size: 13px; display: flex; gap: 4px 12px; flex-wrap: wrap; align-items: center; }
.copy-id { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-height: 28px; padding: 0 6px; margin: -2px -6px; border-radius: 6px; position: relative; }
.copy-id::before { content: ""; position: absolute; inset: -8px 0; }
.copy-id:hover { color: var(--accent); background: var(--wash); }
.tags { display: grid; justify-items: end; gap: 4px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.tag i { width: 8px; height: 8px; border-radius: 50%; }
.tag.left { color: var(--bad); }
.row.gone .name, .row.gone .avatar { opacity: .6; }

/* ------------------------------------------------------------------ التحكم */
.statusline { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; padding: 12px 16px; }
.group > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 60px; cursor: pointer; border-radius: var(--r-card); transition: background var(--fast); }
.group > summary:hover { background: var(--raised); }
.group > summary::-webkit-details-marker { display: none; }
.group > summary h2 { font-size: 16px; font-weight: 600; flex: 1; }
.group > summary .count { color: var(--muted); font-size: 13px; }
.badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 20px; color: var(--accent); background: var(--wash); }
.chev { color: var(--muted); transition: transform var(--fast) var(--ease-out); }
details[open] > summary .chev { transform: rotate(180deg); }
.group-body { padding: 4px 16px 20px; display: grid; gap: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
.group-help { color: var(--muted); font-size: 14px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field-head { display: flex; align-items: center; gap: 12px; min-height: 24px; }
.field-head .f-label { flex: 1; }
.inline { display: flex; align-items: center; gap: 16px; justify-content: space-between; min-height: 44px; }
.preview { border-radius: var(--r-ctl); padding: 12px 14px; background: #313338; color: #dbdee1; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.preview img.e { width: 22px; height: 22px; vertical-align: -5px; object-fit: contain; }
.preview .h1 { font-size: 1.5em; font-weight: 700; } .preview .h2 { font-size: 1.25em; font-weight: 700; } .preview .h3 { font-size: 1.05em; font-weight: 700; }
.preview code { background: #1e1f22; padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; direction: ltr; unicode-bidi: isolate; }
.preview .m { background: rgba(88, 101, 242, .3); color: #c9cdfb; border-radius: 4px; padding: 0 3px; }
.pick { display: flex; align-items: center; gap: 10px; width: 100%; text-align: start; }
.pick .val { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .none { color: var(--faint); }
.id-list { display: grid; gap: 8px; }
.id-row { display: flex; gap: 8px; align-items: center; }
.id-row .input { flex: 1; min-width: 0; }
.image-field { display: grid; gap: 12px; justify-items: start; }
.image-field .shot { width: 100%; border-radius: var(--r-ctl); border: 1px solid var(--border); background: var(--raised); min-height: 88px; display: grid; place-items: center; overflow: hidden; color: var(--faint); font-size: 14px; }
.image-field .shot img { display: block; width: 100%; max-height: 240px; object-fit: contain; }
.items { display: grid; gap: 8px; }
.item { border: 1px solid var(--border); border-radius: 12px; background: var(--raised); }
.item > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; cursor: pointer; min-height: 52px; border-radius: 12px; transition: background var(--fast); }
.item > summary:hover { background: var(--hover); }
.item > summary::-webkit-details-marker { display: none; }
.item > summary .t { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.item > summary .t.blank { color: var(--faint); font-weight: 400; }
.item-body { padding: 16px 12px; display: grid; gap: 20px; border-top: 1px solid var(--border); }
.item .input { background: var(--card); }
.item-tools { display: flex; gap: 8px; align-items: center; }
.item-tools .sp { flex: 1; }
.item .item { background: var(--card); } .item .item .input { background: var(--raised); }
.savebar { position: fixed; inset-inline: 0; bottom: 0; z-index: 30; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; transform: translateY(110%); visibility: hidden; transition: transform var(--slow) var(--ease-out), visibility 0s var(--slow); }
.savebar.show { transform: none; visibility: visible; transition: transform var(--slow) var(--ease-out); }
.savebar .msg { flex: 1; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.savebar .msg .dot { background: var(--warn); }
@media (min-width: 1024px) { .savebar { padding-inline: 32px; } }

/* ------------------------------------------------------------------ الرسوم والجداول */
.chart { position: relative; padding: 8px 16px 16px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; direction: ltr; }
.chart text { font: 400 12px var(--font); fill: var(--faint); }
.chart .grid { stroke: var(--border); stroke-width: 1; }
.chart .hit { fill: transparent; cursor: pointer; outline: none; }
.chart .hit:hover, .chart .hit:focus-visible, .chart .hit.on { fill: var(--wash); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); padding: 8px 16px 0; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--raised); border: 1px solid var(--control); border-radius: 10px; padding: 8px 12px; font-size: 13px; min-width: 128px; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); }
.tip b { display: block; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
.tip div { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.tip div span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.tip div i { width: 10px; height: 3px; border-radius: 2px; }
.tip div strong { font-weight: 600; }
.bars { display: grid; gap: 4px; padding: 12px 16px 16px; }
.bar-row { display: grid; grid-template-columns: minmax(80px, 32%) 1fr auto; gap: 12px; align-items: center; min-height: 32px; font-size: 14px; }
.bar-row .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.bar-row .track { height: 12px; display: flex; }
.bar-row .fill { height: 12px; background: var(--series-1); border-radius: 4px 0 0 4px; min-width: 2px; }
.bar-row .val { font-weight: 600; min-width: 2em; text-align: end; }
.bar-row .val small { color: var(--muted); font-weight: 400; font-size: 13px; margin-inline-start: 8px; }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: start; color: var(--muted); font-weight: 500; font-size: 13px; padding: 0 12px; height: 44px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t th button { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-weight: 500; color: inherit; }
table.t th button:hover, table.t th[aria-sort] button { color: var(--text); }
table.t td { padding: 0 12px; height: 44px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.t td.clip { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; }
table.t th:first-child, table.t td:first-child { padding-inline-start: 16px; } table.t th:last-child, table.t td:last-child { padding-inline-end: 16px; }

function watch() {
  unsubs.forEach((u) => u()); unsubs = [];
  const st = S(); const srv = store.server;
  const guard = (fn) => (snap) => { if (store.server === srv) fn(snap); };
  const fail = (e) => { if (store.server !== srv) return; st.error = explainError(e); render(); };
  unsubs.push(onSnapshot(sub("info", "guild"), guard((d) => { st.guild = d.exists() ? d.data() : {}; render(); }), fail));
  if (srv === "lucifer") {
    unsubs.push(onSnapshot(sub("info", "broadcast"), guard((d) => { st.bcInfo = d.exists() ? d.data() : false; if (store.page === "bot-broadcast") render(); }), fail));
    unsubs.push(onSnapshot(query(subcol("broadcasts"), orderBy("created_at", "desc"), limit(150)), guard((q) => { st.bcHistory = q.docs.map((x) => ({ id: x.id, ...x.data() })); if (store.page === "bot-broadcast") render(); }), fail));
    const trRender = () => { if (store.page === "bot-transfers") render(); };
    unsubs.push(onSnapshot(query(subcol("tr_requests"), orderBy("created_at", "desc"), limit(400)), guard((q) => { st.trReq = q.docs.map((x) => x.data()); trRender(); }), fail));
    unsubs.push(onSnapshot(query(subcol("tr_withdrawals"), orderBy("created_at", "desc"), limit(300)), guard((q) => { st.trWd = q.docs.map((x) => x.data()); trRender(); }), fail));
    unsubs.push(onSnapshot(subcol("tr_wallets"), guard((q) => { st.trWallets = q.docs.map((x) => ({ id: x.id, ...x.data() })); trRender(); }), fail));
  }
  for (const bot of BOT_KEYS) {
    unsubs.push(onSnapshot(sub("schema", bot), guard((d) => { st.schema[bot] = d.exists() ? d.data() : false; rebase(bot); render(); }), fail));
    unsubs.push(onSnapshot(sub("settings", bot), guard((d) => { st.settings[bot] = d.exists() ? d.data() : {}; rebase(bot); render(); }), fail));
    unsubs.push(onSnapshot(sub("status", bot), guard((d) => {
      const before = st.status[bot]; st.status[bot] = d.exists() ? d.data() : false;
      const wait = st.waiting && st.waiting[bot];
      if (wait && st.status[bot] && st.status[bot].applied_rev >= wait) {
        st.waiting[bot] = 0;
        const errs = Object.values(st.status[bot].errors || {});
        toast(errs.length ? "البوت استلم التعديل بس بيه ملاحظات" : "وصل للبوت وانطبق", 3200);
      }
      if (!same(before, st.status[bot])) render();
    }), fail));
  }
}

// القيم الفعالة = الأصلية من البوت + اللي معدل بالموقع
function fieldsOf(bot) { const sc = S().schema[bot]; return sc ? sc.groups.flatMap((g) => g.fields) : []; }
function effective(bot) {
  const st = S(); const values = (st.settings[bot] && st.settings[bot].values) || {}; const out = {};
  for (const f of fieldsOf(bot)) out[f.key] = clone(f.key in values ? values[f.key] : f.default);
  return out;
}
function rebase(bot) {
  const st = S(); if (!st.schema[bot] || st.settings[bot] === undefined) return;
  const next = effective(bot);
  const dirty = st.draft[bot] && st.base[bot] && !same(st.draft[bot], st.base[bot]);
  st.base[bot] = next;
  if (!dirty) st.draft[bot] = clone(next);
}
const isDirty = (bot) => { const st = S(); return !!(st.draft[bot] && st.base[bot] && !same(st.draft[bot], st.base[bot])); };

async function loadCustomers(force) {

  st.loadingCustomers = true;
  try {
    const [snap, info] = await Promise.all([getDocs(subcol("customers")), getDoc(sub("info", "customers"))]);
    st.customers = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    st.customersInfo = info.exists() ? info.data() : null; st.error = null;
  } catch (e) { st.error = explainError(e); st.customers = st.customers || []; }
  st.loadingCustomers = false; render();
}
function rangeStart(id) { const r = RANGES.find((x) => x.id === id); return r.days ? new Date(Date.now() - r.days * 864e5) : null; }

  const st = S(); if (st.tickets[range] || st.loadingTickets === range) return;
  st.loadingTickets = range;

    const col = collection(db, SERVERS[store.server].tickets); const start = rangeStart(range);

      getDocs(start ? query(col, where("created_at", ">=", Timestamp.fromDate(start))) : col),
      getDocs(query(col, where("status", "==", "open"))),

}

}
async function loadReviews(range) {
  const st = S(); if (st.reviews[range] || st.loadingReviews === range) return;
  st.loadingReviews = range;

let renderQueued = false;
function render() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; draw(); }); }
function draw() {
  document.documentElement.dataset.server = store.server;
  document.querySelector('meta[name="theme-color"]').content = SERVERS[store.server].theme;
  if (!store.user) return drawLogin();
  if (store.denied) return drawDenied();
  const page = PAGES.find((p) => p.id === store.page);
  chatSync(); document.body.classList.toggle("chat-mode", page.id === "bot-chat");
  if (page.id === "bot-chat" && chatMounted()) { chatRefresh(); document.title = `${page.title} - ${SERVERS[store.server].name}`; return; }
  const keep = captureFocus();
  const scroll = window.scrollY;
  $app.replaceChildren(drawTopbar(page), drawDrawer(), h("div", { class: "scrim", onclick: closeDrawer }), drawMain(page), drawSaveBar(page));
  document.title = `${page.title} - ${SERVERS[store.server].name}`;
  window.scrollTo(0, store.focusMain ? 0 : scroll);
  if (page.id === "bot-chat") { store.focusMain = false; chatRefresh(); return; }
  if (store.focusMain) { store.focusMain = false; $app.querySelector("main").focus({ preventScroll: true }); }
  else restoreFocus(keep);
}
function captureFocus() {
  const el = document.activeElement;
  if (!el || !el.dataset || !el.dataset.fk) return null;
  return { key: el.dataset.fk, start: el.selectionStart, end: el.selectionEnd };
}
function restoreFocus(keep) {
  if (!keep) return;
  const el = document.querySelector(`[data-fk="${CSS.escape(keep.key)}"]`);
  if (!el) return;
  el.focus({ preventScroll: true });
  try { if (keep.start != null) el.setSelectionRange(keep.start, keep.end); } catch {}
}
function closeDrawer() { document.body.classList.remove("side-open"); }
